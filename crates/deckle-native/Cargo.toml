[package]
name = "deckle-native"
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
description = "Camada 1 do deckle.nvim: renderiza Mermaid em arte de texto para o Neovim via mlua."
license = "MIT"
publish = false

[lib]
name = "deckle_native"
crate-type = ["cdylib"]

[dependencies]
# Versao EXATA e IDENTICA nos dois crates. O merman quebra API entre versoes, e `cargo add`
# ja resolveu versoes diferentes para os dois (V5). Ao subir, mude os dois, o ADR-0002, o
# CLAUDE.md e `PINNED` em scripts/check-merman-version.sh.
#
# `all-diagrams` e obrigatorio nos dois: sem ele o merman 0.8.0 nao compila os parsers e o
# flowchart some (ADR-0002, secao "merman 0.8.0").
merman-core = { version = "=0.8.0", features = ["all-diagrams"] }
merman-ascii = { version = "=0.8.0", features = ["all-diagrams"] }
mlua = { version = "0.11", features = ["module", "luajit"] }
