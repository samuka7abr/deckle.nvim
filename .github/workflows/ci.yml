# CI do deckle.nvim: formatação, lint e testes.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    name: format (stylua)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua/ plugin/ tests/ scripts/run.lua

  lint:
    name: lint (selene)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Binário estático, não `cargo install`: instala em segundos em vez de minutos.
      # A tag é fixa de propósito — `latest/download` com nome de arquivo versionado
      # quebra silenciosamente no dia em que sair a 0.32.
      - name: Baixar binário estático do selene
        env:
          SELENE_VERSION: 0.31.0
        run: |
          curl -fsSLo selene.zip \
            "https://github.com/Kampfkarren/selene/releases/download/${SELENE_VERSION}/selene-${SELENE_VERSION}-linux.zip"
          unzip selene.zip -d selene-bin
          chmod +x selene-bin/selene
          echo "$PWD/selene-bin" >> "$GITHUB_PATH"
      - run: selene lua/ plugin/ tests/ scripts/run.lua

  test:
    name: test (nvim ${{ matrix.nvim-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # O 0.10.4 esteve aqui como job permissivo e saiu na fase 0: reprovou 20 dos 39
        # casos, e a causa é o piso de versão, não bug. Ver "Decisões ainda em aberto"
        # em docs/roadmap.md.
        nvim-version: [v0.11.0, nightly]
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim-version }}
      - run: ./scripts/test.sh

  # Camada 1: crate Rust `deckle-native`. Os jobs abaixo so cobrem o Rust e o `.so`.
  rust:
    name: rust (fmt, clippy, test, merman)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      # A versao vem do rust-toolchain.toml, para a CI e a maquina local nao divergirem.
      # Sem argumento o rustup instala o que o arquivo pede, mas isso depende de rustup >= 1.28;
      # ler o canal do arquivo funciona em qualquer versao.
      - name: Instalar a toolchain do rust-toolchain.toml
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "${channel}"
          rustup toolchain install "${channel}" --profile minimal --component rustfmt --component clippy
          rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      # Falha se o cargo resolver o merman para versao diferente da pinada (V5).
      - name: versao do merman
        run: ./scripts/check-merman-version.sh

  native:
    name: native (nvim ${{ matrix.nvim-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nvim-version: [v0.11.0, nightly]
    steps:
      - uses: actions/checkout@v4
      - name: Instalar a toolchain do rust-toolchain.toml
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "${channel}"
          rustup toolchain install "${channel}" --profile minimal
          rustc --version
      - uses: Swatinem/rust-cache@v2
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim-version }}
      # `make native` falha alto se o build falhar, e o script confere o exit code do nvim
      # (134 = abort, e a regressao de V2 que este job existe para pegar). Depois roda os
      # testes do mermaid no preview que exigem o `.so` (tests/native/test_mermaid_native.lua e
      # test_docs_native.lua: o showcase e a captura do README, com DECKLE_REQUIRE_NATIVE=1:
      # sem o `.so` eles falham aqui). No job `test`, sem Rust, esses mesmos casos sao pulados
      # com aviso, e os de degradacao rodam de verdade.
      - run: ./scripts/test-native.sh
